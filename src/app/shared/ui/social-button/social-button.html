<button
  type="button"
  [disabled]="disabled()"
  [class]="
    'inline-flex min-h-[56px] items-center justify-center gap-3 rounded-full px-6 text-sm font-semibold border transition-all cursor-pointer disabled:cursor-not-allowed disabled:opacity-50 focus-visible:outline-2 focus-visible:outline-primary-600 focus-visible:outline-offset-2 ' +
    containerClasses()
  "
  (click)="onClick.emit($event)"
>
  @if (provider() === 'google') {
    <!-- Google colorful SVG icon -->
    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.89c2.28-2.1 3.65-5.2 3.65-9.15z"/>
      <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.89-3.05c-1.08.72-2.45 1.16-4.04 1.16-3.12 0-5.77-2.1-6.72-4.94H1.26v3.13C3.25 21.32 7.34 24 12 24z"/>
      <path fill="#FBBC05" d="M5.28 14.26c-.25-.72-.38-1.49-.38-2.26s.14-1.54.38-2.26V6.61H1.26C.46 8.23 0 10.06 0 12s.46 3.77 1.26 5.39l4.02-3.13z"/>
      <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.25 2.68 1.26 6.61l4.02 3.13c.95-2.84 3.6-4.99 6.72-4.99z"/>
    </svg>
  } @else {
    <!-- Facebook white SVG icon -->
    <svg class="w-5 h-5 shrink-0 fill-current" viewBox="0 0 24 24">
      <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
    </svg>
  }

  <span>{{ labelKey() | translate }}</span>
</button>
