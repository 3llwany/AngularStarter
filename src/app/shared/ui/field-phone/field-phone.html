<div class="flex flex-col gap-1.5 w-full text-start">
  @if (label()) {
    <label [for]="inputId" class="text-xs font-semibold text-surface-700 ms-1">
      {{ label() | translate }}
    </label>
  }

  <div
    [class]="
      'flex min-h-[54px] items-center rounded-[18px] border transition-all overflow-hidden ' +
      containerClasses()
    ">
    <!-- Dial code selector -->
    <div
      class="flex items-center gap-1 ps-3.5 pe-2.5 py-2 border-e border-surface-200/80 bg-surface-50 shrink-0 rounded-xl m-1 mx-2">
      <select
        [ngModel]="countryCode()"
        (ngModelChange)="countryCode.set($event)"
        [disabled]="disabled()"
        class="bg-transparent text-md font-mono font-bold text-surface-800 outline-none cursor-pointer"
        dir="ltr"
        aria-label="Country Dial Code">
        @for (c of dialCodes; track c.code) {
          <option [value]="c.code">
            <!-- {{ c.flag }} -->
            {{ c.code }}
          </option>
        }
      </select>
    </div>

    <!-- Phone number input -->
    @if (field(); as f) {
      <input
        [id]="inputId"
        type="tel"
        [formField]="f"
        [placeholder]="placeholder()"
        [attr.aria-invalid]="showError()"
        [attr.aria-describedby]="showError() ? errorId() : null"
        class="flex-1 min-w-0 bg-transparent ps-3.5 pe-4 py-2 text-sm font-mono text-surface-900 placeholder:text-surface-400 outline-none"
        dir="ltr" />
    } @else {
      <input
        [id]="inputId"
        type="tel"
        [ngModel]="value()"
        (ngModelChange)="onInput($event)"
        [placeholder]="placeholder()"
        [disabled]="disabled()"
        [attr.aria-invalid]="showError()"
        [attr.aria-describedby]="showError() ? errorId() : null"
        class="flex-1 min-w-0 bg-transparent ps-3.5 pe-4 py-2 text-sm font-mono text-surface-900 placeholder:text-surface-400 outline-none"
        dir="ltr" />
    }
  </div>

  @if (showError()) {
    <app-field-error [errorId]="errorId()" [message]="errorMessage()" />
  }
</div>
