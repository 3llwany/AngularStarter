<div class="flex items-center justify-between gap-2 mt-1.5 px-1 text-xs">
  <div class="flex items-center gap-1.5 min-w-0 flex-1 text-start">
    @if (error()) {
      <div role="alert" class="flex items-center gap-1 text-[#b42318] font-medium">
        <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
        </svg>
        <span>{{ error()! | translate }}</span>
      </div>
    } @else if (helper()) {
      <span class="text-surface-500">{{ helper()! | translate }}</span>
    } @else {
      <ng-content />
    }
  </div>

  @if (maxCount() !== null) {
    <span class="font-mono text-surface-400 ms-auto shrink-0" dir="ltr">
      {{ count() ?? 0 }} / {{ maxCount() }}
    </span>
  }
</div>
