<div class="flex w-full flex-col gap-2">
  @if (label()) {
    <span [id]="labelId" class="text-[13px] font-semibold leading-[1.3] text-ink">
      {{ label() | translate }}
    </span>
  }

  <input
    #fileInput
    type="file"
    class="sr-only"
    tabindex="-1"
    aria-hidden="true"
    [id]="inputId"
    [accept]="accept()"
    [disabled]="isDisabled()"
    (change)="onFileChange($event)"
  />

  <div
    [class]="zoneClasses()"
    [attr.data-state]="state()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <button
      type="button"
      class="upload-trigger flex min-w-0 flex-1 items-center gap-3.5 text-start outline-none cursor-pointer disabled:cursor-not-allowed"
      [disabled]="isDisabled()"
      [attr.aria-labelledby]="label() ? labelId + ' ' + titleId : titleId"
      [attr.aria-describedby]="describedBy()"
      (click)="openPicker(fileInput)"
    >
      <span [class]="tileClasses()" aria-hidden="true">
        <i class="pi pi-upload text-[20px]"></i>
      </span>

      <span class="flex min-w-0 flex-1 flex-col gap-0.5">
        <span [id]="titleId" [class]="titleClasses()">
          @if (state() === 'uploading' || state() === 'uploaded') {
            <bdi>{{ displayName() }}</bdi>
          } @else {
            {{ title() | translate }}
          }
        </span>

        @if (hasHint()) {
          <span [id]="hintId" [class]="hintClasses()">
            @switch (state()) {
              @case ('uploading') {
                {{ 'common.upload.uploading' | translate: { percent: progressValue() } }}
              }
              @case ('uploaded') {
                @if (sizeLabel(); as size) {
                  <span dir="ltr">{{ size }}</span>
                  <span aria-hidden="true"> · </span>
                }
                {{ 'common.upload.uploaded' | translate }}
              }
              @default {
                {{ hint() | translate }}
              }
            }
          </span>
        }

        @if (state() === 'uploading') {
          <span
            role="progressbar"
            class="mt-0.5 block h-1 w-full overflow-hidden rounded-xs bg-ink/7"
            aria-valuemin="0"
            aria-valuemax="100"
            [attr.aria-valuenow]="progressValue()"
            [attr.aria-labelledby]="titleId"
          >
            <span
              class="block h-full rounded-xs bg-primary-500 transition-[width] duration-300 ease-out"
              [style.width.%]="progressValue()"
            ></span>
          </span>
        }
      </span>
    </button>

    @if (state() === 'uploaded' && removable()) {
      <button
        type="button"
        class="flex size-11 shrink-0 items-center justify-center rounded-full text-subdued transition-colors cursor-pointer hover:bg-ink/5 hover:text-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600 disabled:cursor-not-allowed"
        [disabled]="isDisabled()"
        [attr.aria-label]="removeLabelKey() | translate"
        (click)="remove()"
      >
        <i class="pi pi-times text-[18px]" aria-hidden="true"></i>
      </button>
    }
  </div>

  @if (errorMessage(); as message) {
    <p
      [id]="errorId"
      role="alert"
      class="flex items-center gap-1.5 text-xs leading-[1.3] text-semantic-error-text"
    >
      <i class="pi pi-exclamation-triangle text-[14px]" aria-hidden="true"></i>
      <span>{{ message | translate: { max: maxSizeLabel() } }}</span>
    </p>
  }
</div>
