<button
  type="button"
  [attr.aria-selected]="active()"
  role="tab"
  [class]="
    'flex flex-col items-center justify-center gap-1 py-1.5 px-3 min-h-[48px] rounded-2xl transition-all cursor-pointer focus-visible:outline-2 focus-visible:outline-primary-600 ' +
    (active()
      ? 'text-primary-700 font-bold bg-primary-50/80 shadow-2xs'
      : 'text-surface-500 hover:text-surface-800 hover:bg-surface-50')
  "
  (click)="onClick.emit()"
>
  <div class="relative flex items-center justify-center">
    <ng-content select="[icon]" />
    @if (icon()) {
      <i [class]="'pi ' + icon() + ' text-lg'" aria-hidden="true"></i>
    }
    @if (badge() !== undefined) {
      <span
        class="absolute -top-1.5 -end-2 flex h-4 min-w-4 items-center justify-center rounded-full bg-rose-600 px-1 text-[10px] font-bold text-white"
      >
        {{ badge() }}
      </span>
    }
  </div>

  <span class="text-[11px] truncate tracking-tight">
    {{ label() | translate }}
  </span>
</button>
