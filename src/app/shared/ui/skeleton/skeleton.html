<div class="flex flex-col gap-2.5 w-full">
  @for (_ of items(); track $index) {
    <p-skeleton
      [shape]="primeShape()"
      [width]="shape() === 'circle' ? computedHeight() : width()"
      [height]="computedHeight()"
      [borderRadius]="computedRadius()"
      [class]="'animate-pulse ' + shapeClass()"
    />
  }
</div>
