<app-dialog
  [(visible)]="visible"
  [header]="headerKey()"
  styleClass="w-full max-w-xl"
>
  <form (submit)="onSubmit(); $event.preventDefault()" class="flex flex-col gap-4 pt-2">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <app-input
        [field]="studentForm.name"
        label="mock.students.form.name_label"
        placeholder="mock.students.form.name_placeholder"
      />
      <app-input
        [field]="studentForm.email"
        label="mock.students.form.email_label"
        placeholder="mock.students.form.email_placeholder"
      />
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <app-input
        [field]="studentForm.phone"
        label="mock.students.form.phone_label"
        placeholder="mock.students.form.phone_placeholder"
      />
      <app-select
        [field]="studentForm.grade"
        [options]="gradeOptions"
        optionLabel="label"
        optionValue="value"
        label="mock.students.form.grade_label"
        placeholder="mock.students.form.grade_placeholder"
      />
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <app-datepicker
        [field]="studentForm.enrollmentDate"
        label="mock.students.form.enrollment_date_label"
      />
      <app-input
        [field]="studentForm.gpa"
        label="mock.students.form.gpa_label"
        placeholder="mock.students.form.gpa_placeholder"
      />
    </div>

    <div
      class="flex items-center justify-between rounded-xl border border-surface-200 bg-surface-50 p-3.5"
    >
      <div>
        <p class="text-sm font-semibold text-surface-900">
          {{ 'mock.students.form.status_label' | translate }}
        </p>
        <p class="text-xs text-surface-500">
          {{
            (formModel().status
              ? 'mock.students.status.active'
              : 'mock.students.status.inactive') | translate
          }}
        </p>
      </div>
      <app-switch [field]="studentForm.status" />
    </div>

    <div dialogFooter class="flex justify-end gap-2 pt-2">
      <app-button
        severity="secondary"
        [outlined]="true"
        label="common.actions.cancel"
        (onClick)="visible.set(false)"
      />
      <app-button
        severity="primary"
        [loading]="saving()"
        label="common.actions.confirm"
        (onClick)="onSubmit()"
      />
    </div>
  </form>
</app-dialog>
