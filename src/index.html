<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>Angular Starter</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="assets/images/logos/starter-logo.svg" />
    <link
      rel="preload"
      href="/fonts/Alexandria-400-1.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var cookies = document.cookie ? document.cookie.split(';') : [];
          var getCookie = function (key) {
            for (var i = 0; i < cookies.length; i++) {
              var part = cookies[i].trim();
              var eq = part.indexOf('=');
              if (eq > -1 && part.slice(0, eq).trim() === key) {
                return decodeURIComponent(part.slice(eq + 1).trim());
              }
            }
            return null;
          };
          var lang = getCookie('app_lang');
          if (lang !== 'ar' && lang !== 'en') {
            var navLangs =
              navigator.languages && navigator.languages.length
                ? navigator.languages
                : [navigator.language || 'ar'];
            lang = 'ar';
            for (var j = 0; j < navLangs.length; j++) {
              var code = (navLangs[j] || '').toLowerCase();
              if (code.indexOf('ar') === 0) {
                lang = 'ar';
                break;
              }
              if (code.indexOf('en') === 0) {
                lang = 'en';
                break;
              }
            }
          }
          root.setAttribute('lang', lang);
          root.setAttribute('dir', lang === 'en' ? 'ltr' : 'rtl');
        } catch (_e) {
          /* ignore storage access errors */
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <app-root></app-root>
  </body>
</html>
